[package]
org = "ballerinax"
name = "ai.aws.bedrock"
version = "0.9.0"
distribution = "2201.12.0"
authors = ["Ballerina"]
keywords = ["ai", "aws", "bedrock", "llm", "embeddings", "converse", "mantle", "knowledge base", "rag", "Area/AI & Machine Learning", "Type/Model Provider", "Type/Embedding Provider", "Type/Knowledge Base", "Type/Connector", "Vendor/AWS"]
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.aws.bedrock"
license = ["Apache-2.0"]

[build-options]
observabilityIncluded = true

# Credential resolution (`aws.auth`) and endpoint metadata (`aws`). Signing stays
# in-module: `auth:getSignedHeaders` always treats `/` as a path separator, so it
# cannot produce the `%252F` a Bedrock model-id ARN needs in the canonical URI.
# See the note above `signedHeaders` in transport.bal.
[[dependency]]
org = "ballerinax"
name = "aws"
version = "1.0.1"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
# Native shim for generate() (design §3). Built by `./gradlew :ai.aws.bedrock-native:build`.
groupId = "io.ballerina.lib"
artifactId = "ai.aws.bedrock-native"
version = "0.9.0"
path = "../native/build/libs/ai.aws.bedrock-native-0.9.0-SNAPSHOT.jar"
