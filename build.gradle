plugins {
    id "com.github.spotbugs-base"
    id 'com.github.johnrengelman.shadow'
    id 'de.undercouch.download'
    id 'net.researchgate.release'
}

allprojects {
    group = project.group
    version = project.version

    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }

        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }

        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }

        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

task build {
    dependsOn(':ai.aws.bedrock-compiler-plugin:build')
    dependsOn(':ai.aws.bedrock-native:build')
    dependsOn(':ai.aws.bedrock-ballerina:build')
}

// `bal build` loads BOTH jars by path: Ballerina.toml points at the native jar and
// CompilerPlugin.toml at the compiler-plugin jar. Order the Ballerina build after
// both, or the plugin can be loaded before its jar exists and fail intermittently.
// `getByPath` over `findByPath`: a wrong path should fail configuration with a
// clear message, not NPE on a null task.
tasks.getByPath(':ai.aws.bedrock-ballerina:build').mustRunAfter(
        ':ai.aws.bedrock-native:build',
        ':ai.aws.bedrock-compiler-plugin:build')

release {
    buildTasks = ['build']
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v${version}'
    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}
