[package]
org = "dasunorg"
name = "ai.aws.bedrock"
version = "@toml.version@"
distribution = "2201.13.5"
authors = ["Ballerina"]
keywords = ["ai", "aws", "bedrock", "llm", "embeddings", "converse", "mantle", "Area/AI & Machine Learning", "Type/Model Provider", "Type/Embedding Provider", "Type/Connector", "Vendor/AWS"]
repository = "https://github.com/ballerina-platform/module-ballerinax-ai.aws.bedrock"
license = ["Apache-2.0"]
icon = "icon.png"

visibility = "private"

[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
# Native shim for generate(). Built by `./gradlew :ai.aws.bedrock-native:build`.
groupId = "io.ballerina.lib"
artifactId = "ai.aws.bedrock-native"
version = "@toml.version@"
path = "../native/build/libs/ai.aws.bedrock-native-@project.version@.jar"
